# Publica a app AnkoraOne_DC_Repo no Base44 (POST /api/apps/{app_id}/deploy).
#
# A app é nativa do Base44: o código é sincronizado deste repositório para a app (ver docs/deploy-base44.md)
# e a publicação inclui frontend, funções, entidades e workflows agendados. Este workflow só publica a versão
# que já está na app; não envia código. Corre à mão (Actions → Publicar no Base44 → Run workflow).
#
# Requer o segredo BASE44_API_KEY (token pessoal com acesso de edição à app).

name: Publicar no Base44

on:
  workflow_dispatch:
    inputs:
      checkpoint_id:
        description: 'Checkpoint a publicar (vazio = versão atual da app)'
        required: false
        default: ''

concurrency:
  group: deploy-base44
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASE44_APP_ID: 6adf8df867faaf60a171efa5   # app "AnkoraOne_DC_Repo" no Base44

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publicar
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          CHECKPOINT_ID: ${{ inputs.checkpoint_id }}
        run: |
          if [ -z "$BASE44_API_KEY" ]; then echo "::error::Falta o segredo BASE44_API_KEY"; exit 1; fi
          if [ -n "$CHECKPOINT_ID" ]; then body="{\"checkpoint_id\":\"${CHECKPOINT_ID}\"}"; else body='{}'; fi
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            "https://app.base44.com/api/apps/${BASE44_APP_ID}/deploy" \
            -H "Authorization: Bearer ${BASE44_API_KEY}" -H 'Content-Type: application/json' -d "$body")
          echo "HTTP ${status}"; cat response.json; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then echo "::error::Publicação recusada (HTTP ${status})"; exit 1; fi
          echo "### Publicado no Base44" >> "$GITHUB_STEP_SUMMARY"
          cat response.json >> "$GITHUB_STEP_SUMMARY"
