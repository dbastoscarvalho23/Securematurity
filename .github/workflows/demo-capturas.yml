# Compila a versão de demonstração (dados fictícios) e guarda-a no ramo demo-capturas. Ramo temporário.
name: Demo para capturas
on:
  push:
    branches: [demo-capturas]
    paths: ['.demo/mockBase44.js', '.demo/vite.demo.config.js', '.github/workflows/demo-capturas.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps
      - run: node node_modules/vite/bin/vite.js build --config .demo/vite.demo.config.js
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f .demo/dist
          git commit -m "Versão de demonstração compilada" || echo "sem alterações"
          git push
