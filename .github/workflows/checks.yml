# Verificações em cada PR: testes do frontend, nomes por definir nas funções do Base44
# e, no servidor próprio, os testes ponta a ponta com PostgreSQL.
name: Verificações

on:
  pull_request:
    branches: [main, feat/self-hosting]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install e não npm ci: o package-lock.json está desalinhado do package.json desde o PR #45
      # (versões subidas pelo editor da Base44). Voltar a npm ci quando o lock for regenerado.
      - run: npm install --no-audit --no-fund
      - name: Nomes por definir nas funções
        run: node scripts/check-function-names.cjs
      - name: Testes
        run: npm test

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ankoraone
          POSTGRES_PASSWORD: ankoraone
          POSTGRES_DB: ankoraone_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ankoraone" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências do servidor
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Testes do servidor
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://ankoraone:ankoraone@localhost:5432/ankoraone_test
        run: npm test
