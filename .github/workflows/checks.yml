# Verificações em cada PR para main: testes do frontend e nomes por definir nas funções do Base44.
name: Verificações

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install e não npm ci: o package-lock.json está desalinhado do package.json desde o PR #45
      # (versões subidas pelo editor da Base44). Voltar a npm ci quando o lock for regenerado.
      - run: npm install --no-audit --no-fund
      - name: Nomes por definir nas funções
        run: node scripts/check-function-names.cjs
      - name: Testes
        run: |
          set +e
          npm test > test-output.txt 2>&1; status=$?
          cat test-output.txt
          if [ $status -ne 0 ]; then
            # As falhas também vão para uma anotação, legível pela API do GitHub.
            msg=$(grep -E "FAIL|not ok|Error|expected|actual|message:|at .*test\.js|✗|×" test-output.txt | sed "s/\x1b\[[0-9;]*m//g" | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Testes falharam::${msg}"
          fi
          exit $status
