# Agendador das funções do Base44.
# A app Securematurity é importada do GitHub e o Base44 não corre workflows nesse tipo de app; este ficheiro
# substitui os agendamentos de base44/workflows/. Horas em UTC.
# Requer o segredo do repositório AUTOMATION_SECRET (o mesmo valor do segredo AUTOMATION_SECRET da app no Base44).
name: Agendador Base44

on:
  schedule:
    - cron: '17 */4 * * *'   # Alertas CVE (cveMonitor)
    - cron: '0 7 * * *'      # Lembretes de revisão de documentos e prazos de risco
    - cron: '0 5 1 * *'      # Relatório mensal (generateMonthlyAnnualReport)
  workflow_dispatch:
    inputs:
      function:
        description: 'Função a executar agora'
        required: true
        type: choice
        options: [cveMonitor, documentReviewReminders, riskDueDateReminders, generateMonthlyAnnualReport, dataRetentionPurge]
      confirm_purge:
        description: 'Para dataRetentionPurge escreva APAGAR (elimina dados fora do prazo de conservação)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: base44-scheduler-${{ github.event.schedule || inputs.function }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ID: 6ab5373e7f8f586c80cb9ed8
      APP_HOST: https://securematurity-80cb9ed8.base44.app
      AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
    steps:
      - name: Escolher funções
        id: pick
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            "schedule:17 */4 * * *") echo "fns=cveMonitor" >> "$GITHUB_OUTPUT" ;;
            "schedule:0 7 * * *")    echo "fns=documentReviewReminders riskDueDateReminders" >> "$GITHUB_OUTPUT" ;;
            "schedule:0 5 1 * *")    echo "fns=generateMonthlyAnnualReport" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch:*)
              if [ "${{ inputs.function }}" = "dataRetentionPurge" ] && [ "${{ inputs.confirm_purge }}" != "APAGAR" ]; then
                echo "::error::dataRetentionPurge só corre com confirm_purge=APAGAR"; exit 1
              fi
              echo "fns=${{ inputs.function }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Evento desconhecido"; exit 1 ;;
          esac

      - name: Executar
        run: |
          set -u
          if [ -z "${AUTOMATION_SECRET:-}" ]; then echo "::error::Falta o segredo AUTOMATION_SECRET no repositório"; exit 1; fi
          fail=0
          for fn in ${{ steps.pick.outputs.fns }}; do
            ok=0
            for path in "/api/apps/${APP_ID}/functions/${fn}" "/api/functions/${fn}"; do
              code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 600 -X POST "${APP_HOST}${path}" \
                -H 'Content-Type: application/json' -H "x-automation-secret: ${AUTOMATION_SECRET}" \
                -d '{"action":"run_all"}' || echo 000)
              echo "${fn} ${path} -> HTTP ${code}"
              head -c 600 resp.json; echo
              if [ "${code}" -ge 200 ] && [ "${code}" -lt 300 ]; then ok=1; break; fi
              if [ "${code}" != "404" ]; then break; fi
            done
            [ "${ok}" = 1 ] || { echo "::error::${fn} falhou"; fail=1; }
          done
          exit ${fail}
