services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  node_modules:
