name: securematurity

services:
  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      # Platform-managed sandbox flags (must stay bare; never hardcode values)
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      # Committed placeholders — let compose boot without platform secrets
      - ./.env.base44-defaults
      # Platform secrets (VITE_BASE44_APP_ID, VITE_BASE44_APP_BASE_URL, ...) — LAST entry always wins
      - /run/base44/app.env
    command: sh -ec "CI=true npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    restart: on-failure
    labels:
      base44.project: "Securematurity"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test: ["CMD", "sh", "-ec", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  node_modules:
