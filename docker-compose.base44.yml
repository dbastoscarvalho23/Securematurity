services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
      - base44-cli-auth:/root/.base44
    command: sh -c "command -v base44 >/dev/null 2>&1 || npm install -g base44@latest deno; npm install; export BASE44_APP_ID=\"$$VITE_BASE44_APP_ID\"; exec base44 dev"
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const id=process.env.VITE_BASE44_APP_ID;
          const check=async(name,url,ok)=>{try{const r=await fetch(url);if(!ok.includes(r.status))throw new Error('status '+r.status);console.log(name+' ok');return true}catch(e){console.log(name+' FAIL: '+e.message);return false}};
          (async()=>{const fe=await check('frontend','http://127.0.0.1:5173/',[200]);
          const be=await check('backend','http://127.0.0.1:4400/api/apps/'+id+'/entities/Customer',[200,401,403]);
          process.exit(fe&&be?0:1)})()"
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  base44-cli-auth:
