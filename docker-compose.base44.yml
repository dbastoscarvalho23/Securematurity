services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
      - base44-cli-auth:/root/.base44
    command: sh /app/.base44/dev-entrypoint.sh
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Alvo da preview: `local` (por omissão) levanta o backend desta branch em
      # memória; `cloud` serve só o frontend contra o backend real. Alternar
      # entre os dois exige apenas recriar este serviço — nunca dois alvos no
      # mesmo porto 3000. A identidade de teste (BASE44_DEV_IDENTITY +
      # x-base44-dev-actor) é definida pelo entrypoint e só existe no alvo local.
      - BASE44_PREVIEW_TARGET=${BASE44_PREVIEW_TARGET:-local}
    env_file:
      # As credenciais/URL do backend vêm daqui (nunca do repositório).
      - /run/base44/app.env
    restart: on-failure
    healthcheck:
      # Verifica os DOIS componentes e diz qual falhou. No alvo local o backend
      # é o emulador em 4400; no alvo cloud não há backend local, pelo que o que
      # se prova é o proxy do vite a alcançar o backend real (401/200 servem —
      # o que não pode acontecer é o proxy não responder).
      test:
        - CMD-SHELL
        - >-
          node -e "const id=(process.env.VITE_BASE44_APP_ID||'').replace(/[^0-9a-f]/gi,'');
          const cloud=(process.env.BASE44_PREVIEW_TARGET||'local')==='cloud';
          const probe=async(name,url)=>{try{const r=await fetch(url);if(r.status>=500)throw new Error('status '+r.status);console.log(name+' ok ('+r.status+')');return true}catch(e){console.log(name+' FAIL: '+e.message);return false}};
          (async()=>{const frontend=await probe('frontend','http://127.0.0.1:5173/');
          const api=cloud?'http://127.0.0.1:5173/api/apps/'+id+'/entities/Customer':'http://127.0.0.1:4400/api/apps/'+id+'/entities/Customer';
          const backend=await probe(cloud?'backend (via proxy)':'backend (local)',api);
          process.exit(frontend&&backend?0:1)})()"
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  base44-cli-auth:
