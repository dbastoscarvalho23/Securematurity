# AnkoraOne em servidor próprio: PostgreSQL + MinIO (S3) + API + frontend.
#
#   cp .env.selfhost.example .env.selfhost   # e preencher os valores
#   docker compose -f docker-compose.selfhost.yml --env-file .env.selfhost up -d --build
#
# A aplicação fica disponível em http://<servidor>:${WEB_PORT:-8080}. Em produção, coloque à frente
# um proxy com HTTPS (Caddy, Traefik, Nginx) — ver README.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ankoraone}
      POSTGRES_USER: ${POSTGRES_USER:-ankoraone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Defina S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Defina S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Consola de administração do MinIO (opcional): descomente e aceda por túnel SSH.
    # ports:
    #   - "127.0.0.1:9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-ankoraone} &&
      mc anonymous set none local/$${S3_BUCKET:-ankoraone}"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-ankoraone}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env.selfhost
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ankoraone}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ankoraone}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-ankoraone}
      S3_FORCE_PATH_STYLE: "true"
      # Proxies de confiança à frente da API: Nginx (web) = 1. Com Caddy/Traefik à frente, use 2.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres-data:
  minio-data:
